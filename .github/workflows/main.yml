name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cek file proyek
        run: |
          ls -la
          for f in package.json index.js App.js app.json lib/db.js screens/DashboardScreen.js components/ErrorBoundary.js tests/helpers/setup.js; do
            test -f "$f" || { echo "::error::File $f tidak ada di repo"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --no-audit --no-fund
      - name: Jalankan pengujian (rumus, import, migrasi, ErrorBoundary)
        run: npm test
      - name: Uji bundling JS (error asli tampil di sini)
        run: npx expo export --platform android
      - name: Siapkan keystore rilis (dari Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_BASE64 kosong. Build memakai debug keystore; JANGAN dipakai untuk Play Store."
          fi
      - run: npx expo prebuild --platform android --no-install
      - name: Build APK + AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: budget-planner-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: budget-planner-aab
          path: android/app/build/outputs/bundle/release/app-release.aab